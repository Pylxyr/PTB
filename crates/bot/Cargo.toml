[package]
name = "pyxeetb"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "PyxeeTB: a fast, self-hosted Twitch chat bot, alerts and overlay engine."

[lints]
workspace = true

[dependencies]
pyxeetb-core = { path = "../core" }
# Pure-Rust TLS with the `ring` provider: builds for the static musl target with only musl-gcc installed.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
