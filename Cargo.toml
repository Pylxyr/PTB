[workspace]
resolver = "2"
members = ["crates/core", "crates/bot"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# What ships: one static binary for a 1 GB / 1/8-OCPU server. Whole-program optimisation and a single
# code-generation unit make it smaller and faster; the build is slower, which only CI pays for.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
